<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>The Lof — Тайлан</title>
<style>
  :root {
    --bg: #f2f4f7; --card: #fff; --text: #1b1f24; --muted: #6b7280; --line: #e3e6ea;
    --accent: #1f6feb; --accent-soft: #e7efff; --danger: #d64545; --chip: #eef1f4; --ok: #1a9e5c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa1ab; --line: #2a2f37;
            --accent: #4c8dff; --accent-soft: #1b2a45; --danger: #ff6b6b; --chip: #232830; --ok: #3ccf8e; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  input, textarea, button { font: inherit; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 18px 16px 6px; max-width: 560px; margin: 0 auto; }
  header small { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  header h1 { margin: 2px 0 0; font-size: 22px; }
  main { padding: 8px 16px 110px; max-width: 560px; margin: 0 auto; }
  [hidden] { display: none !important; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .step { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
          font-size: 12px; display: inline-grid; place-items: center; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .seg { display: flex; gap: 6px; margin-bottom: 8px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent);
         padding: 1px 7px; border-radius: 999px; margin-right: 6px; }
  .task.sub { margin-left: 30px; }
  select.mv { flex: none; width: 40px; padding: 4px 0; text-align: center; font-size: 16px;
              background: var(--chip); border-color: transparent; color: var(--accent); }
  select { appearance: none; }
  input, textarea, select { width: 100%; padding: 12px; font-size: 16px; color: var(--text);
                    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; outline: none; }
  .line > select { flex: 1; min-width: 0; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; }
  .muted { color: var(--muted); font-size: 14px; }

  .btn { border: 0; background: var(--accent); color: #fff; font-weight: 600; padding: 12px 16px; border-radius: 10px; }
  .btn.soft { background: var(--accent-soft); color: var(--accent); }
  .btn:disabled { opacity: .6; }
  .line { display: flex; gap: 8px; margin-top: 8px; }
  .line > input { flex: 1; }
  .ghost { width: 100%; border: 1px dashed var(--accent); background: none; color: var(--accent);
           padding: 12px; border-radius: 10px; font-size: 15px; }

  /* Тайлан */
  .day { margin-top: 14px; }
  .day h3 { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
  .entry { padding: 8px 10px; background: var(--bg); border-radius: 8px; margin-bottom: 6px; white-space: pre-wrap; }
  .entry time { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .entry.fin { box-shadow: inset 3px 0 0 var(--ok); }
  .entry.fin .ok { color: var(--ok); font-weight: 700; margin-right: 4px; }
  .fold { cursor: pointer; }
  .cnt { font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }

  /* Ажлууд */
  .task { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .task:last-child { border-bottom: 0; }
  .check { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent);
           background: none; color: var(--ok); font-size: 16px; padding: 0; }
  .task.done .check { border-color: var(--ok); background: var(--ok); color: #fff; }
  .task.done .t { color: var(--muted); text-decoration: line-through; }
  .task .note { font-size: 13px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 0; }

  /* Акт */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; background: var(--chip); color: var(--text); padding: 7px 12px; border-radius: 999px; font-size: 14px; }
  .chip.on { background: var(--accent); color: #fff; }
  .route { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  .swap { border: 0; background: var(--accent-soft); color: var(--accent); width: 44px; height: 44px; border-radius: 10px; font-size: 20px; margin-bottom: 1px; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
  .item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
  .del { border: 0; background: none; color: var(--danger); font-size: 22px; line-height: 1; padding: 0 4px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 8px; }
  .qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .qty button { border: 0; background: var(--chip); color: var(--text); width: 38px; height: 44px; font-size: 20px; }
  .qty input { width: 44px; border: 0; border-radius: 0; text-align: center; padding: 0; background: var(--card); }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ph { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--chip); }
  .ph img { width: 100%; height: 100%; object-fit: cover; }
  .ph button { position: absolute; top: 4px; right: 4px; border: 0; width: 26px; height: 26px; border-radius: 50%;
               background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 1; }
  .ph.add { display: grid; place-items: center; border: 1px dashed var(--accent); background: none; color: var(--accent); font-size: 13px; text-align: center; cursor: pointer; }
  .ph.add span { font-size: 26px; display: block; }
  .act { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .act:last-child { border-bottom: 0; }
  .act b { color: var(--accent); }
  .done-box { background: var(--accent-soft); border-radius: 12px; padding: 14px; margin-bottom: 12px; }

  /* Доод таб */
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
  nav .in { max-width: 560px; width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); }
  /* Туслах */
  .msg { padding: 10px 12px; border-radius: 14px; margin-bottom: 8px; max-width: 88%; white-space: pre-wrap; }
  .msg.user { background: var(--accent); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .msg.assistant { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .ask { position: sticky; bottom: 76px; }
  #mic.rec { background: var(--danger); color: #fff; }
  nav button { border: 0; background: none; color: var(--muted); padding: 6px 0; font-size: 12px; }
  nav button span { display: block; font-size: 22px; }
  nav button.on { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header>
  <small>The Lof · <a href="{{SHEET_URL}}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none">📊 Sheet нээх</a></small>
  <h1 id="title">✅ Ажлууд</h1>
</header>

<main>
  <!-- ═══ ТАЙЛАН ═══ -->
  <section id="tab-log" hidden>
    <div class="card">
      <h2>Өнөөдөр юу хийсэн бэ?</h2>
      <textarea id="logText" rows="3" placeholder="жш: Lof 4 орж тог баригч солисон&#10;(мөр бүр тусдаа бичлэг)"></textarea>
      <div class="line">
        <input type="date" id="logDate" title="Өөр өдөр (хоосон = өнөөдөр)">
        <input id="logTag" list="tags" placeholder="Tag (автомат)" autocomplete="off">
      </div>
      <datalist id="tags">{{TAGS}}</datalist>
      <button class="btn" style="width:100%;margin-top:8px" onclick="addLog(this)">Нэмэх</button>
    </div>
    <div class="card">
      <div class="seg" id="mode">
        <button type="button" class="chip" data-v="day">Өдөр</button>
        <button type="button" class="chip on" data-v="week">7 хоног</button>
        <button type="button" class="chip" data-v="month">Сар</button>
      </div>
      <div class="line" style="margin:0">
        <input type="date" id="pickDate" onchange="loadLog()">
        <select id="tagFilter" onchange="loadLog()"><option value="">Бүх tag</option>{{TAGS}}</select>
        <button class="btn soft" onclick="reportPdf(this)">PDF</button>
      </div>
      <p class="muted" id="rangeLbl" style="margin:8px 0 0"></p>
      <div id="logList"><p class="muted">Ачаалж байна...</p></div>
    </div>
  </section>

  <!-- ═══ АЖЛУУД ═══ -->
  <section id="tab-tasks">
    <div class="card">
      <h2>Хийх ажил нэмэх</h2>
      <div class="seg" id="kind">
        <button type="button" class="chip on" data-v="main">Main ажил</button>
        <button type="button" class="chip" data-v="sub">Sub ажил</button>
      </div>
      <select id="parent" hidden></select>
      <div class="line">
        <input id="taskText" placeholder="жш: Дархан руу 12 PC бэлдэх" onkeydown="if(event.key==='Enter')addTask()">
        <button class="btn" onclick="addTask()">+</button>
      </div>
    </div>
    <div class="card">
      <div id="taskList"><p class="muted">Ачаалж байна...</p></div>
      <details id="doneWrap"><summary>Дууссан ажлууд</summary><div id="doneList"></div></details>
    </div>
  </section>

  <!-- ═══ ТУСЛАХ ═══ -->
  <section id="tab-ai" hidden>
    <div id="chat"></div>
    <div class="card ask">
      <textarea id="aiText" rows="2" placeholder="жш: Дархан руу 12 компьютер өгсөн, акт бэлд"></textarea>
      <div class="line">
        <button class="btn soft" id="mic" type="button" onclick="listen()" aria-label="Ярих">🎤</button>
        <button class="btn" id="aiSend" style="flex:1" onclick="askAI()">Илгээх</button>
        <button class="btn soft" type="button" onclick="resetChat()" aria-label="Шинэ яриа">↺</button>
      </div>
    </div>
  </section>

  <!-- ═══ АКТ ═══ -->
  <section id="tab-act" hidden>
    <div id="actDone" class="done-box" hidden></div>
    <form id="actForm">
      <datalist id="branches">{{BRANCHES}}</datalist>
      <div class="card">
        <h2><span class="step">1</span>Чиглэл</h2>
        <div class="route">
          <div><label>Хаанаас</label><input name="src" id="src" list="branches" required autocomplete="off"></div>
          <button type="button" class="swap" onclick="swapRoute()" aria-label="Солих">⇅</button>
        </div>
        <div class="chips" data-for="src"></div>
        <label>Хаашаа</label>
        <input name="dst" id="dst" list="branches" required autocomplete="off">
        <div class="chips" data-for="dst"></div>
      </div>
      <div class="card">
        <h2><span class="step">2</span>Хүмүүс</h2>
        <label>Өгсөн хүн</label><input name="giver">
        <label>Хүлээн авсан хүн</label><input name="receiver">
      </div>
      <div class="card">
        <h2><span class="step">3</span>Зүйлс</h2>
        <div id="items"></div>
        <button type="button" class="ghost" onclick="addItem(true)">+ Зүйл нэмэх</button>
      </div>
      <div class="card">
        <h2><span class="step">4</span>Зураг</h2>
        <div class="photos" id="photos">
          <label class="ph add" for="pick"><div><span>＋</span>Зураг</div></label>
        </div>
        <input type="file" id="pick" accept="image/*" multiple hidden>
      </div>
      <div class="card">
        <h2><span class="step">5</span>Тэмдэглэл</h2>
        <textarea name="notes" rows="3" placeholder="Нэмэлт мэдээлэл (заавал биш)"></textarea>
        <button class="btn" id="actSend" style="width:100%;margin-top:12px">Акт гаргах · <span id="summary"></span></button>
      </div>
    </form>
    <div class="card">
      <h2>🔎 Өмнөх актууд</h2>
      <input id="actQ" placeholder="Хайх: Дархан, серийн дугаар..." oninput="searchActs()">
      <div id="actList"></div>
    </div>
  </section>
</main>

<nav><div class="in">
  <button data-tab="tasks" class="on"><span>✅</span>Ажлууд</button>
  <button data-tab="log"><span>📝</span>Тайлан</button>
  <button data-tab="act"><span>📄</span>Акт</button>
  <button data-tab="ai"><span>🎤</span>Туслах</button>
</div></nav>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── API (PIN-ийг нэг удаа асууж хадгална) ──
async function api(path, opts = {}) {
  let pin = ''; try { pin = localStorage.pin || ''; } catch {}
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), 'X-PIN': pin } });
  if (r.status === 401) {
    const p = prompt('PIN код');
    if (p === null) throw new Error('PIN шаардлагатай');
    try { localStorage.pin = p; } catch {}
    return api(path, opts);
  }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ('Алдаа ' + r.status));
  return r;
}
const postJSON = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ── Табууд ──
const titles = { log: '📝 Тайлан', tasks: '✅ Ажлууд', act: '📄 Акт', ai: '🎤 Туслах' };
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.tab));
function show(tab) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ['log', 'tasks', 'act', 'ai'].forEach(t => $('#tab-' + t).hidden = t !== tab);
  $('#title').textContent = titles[tab];
  ({ log: loadLog, tasks: loadTasks, act: searchActs, ai: drawChat })[tab]();
  scrollTo(0, tab === 'ai' ? document.body.scrollHeight : 0);
}

// ── Туслах (яриа утсан дээрээ л хадгалагдана) ──
let chat = []; try { chat = JSON.parse(localStorage.chat || '[]'); } catch {}
const saveChat = () => { try { localStorage.chat = JSON.stringify(chat.slice(-40)); } catch {} };
function drawChat() {
  $('#chat').innerHTML = chat.length ? chat.map(m => `<div class="msg ${m.role}">${esc(m.content)}</div>`).join('')
    : '<p class="muted">Юу хийснээ, хийх ажлаа ярьж эсвэл бичээрэй. Жш: "Crystal-д домофон судалсан, гаражийн камер хийх ажил нэм", "Өчигдрийн тайланг PDF болго".</p>';
}
function resetChat() { if (confirm('Шинэ яриа эхлэх үү?')) { chat = []; saveChat(); drawChat(); } }
async function askAI() {
  const t = $('#aiText').value.trim();
  if (!t) return;
  chat.push({ role: 'user', content: t }); $('#aiText').value = ''; drawChat();
  const b = $('#aiSend'); b.disabled = true; b.textContent = 'Бодож байна...';
  scrollTo(0, document.body.scrollHeight);
  try {
    const r = await (await postJSON('/api/chat', { messages: chat })).json();
    chat.push({ role: 'assistant', content: r.text });
    for (const a of r.actions) await doAction(a);
  } catch (e) { chat.push({ role: 'assistant', content: '⚠️ ' + e.message }); }
  saveChat(); drawChat(); b.disabled = false; b.textContent = 'Илгээх';
  scrollTo(0, document.body.scrollHeight);
}
async function doAction(a) {
  if (a.type === 'report_pdf') {
    const qs = `from=${a.start}&to=${a.end}&tag=${encodeURIComponent(a.tag || '')}`;
    download(await (await api('/api/report.pdf?' + qs)).blob(), `Тайлан-${a.start}_${a.end}.pdf`);
  }
  if (a.type === 'prepare_act') {   // маягтыг бөглөөд Акт таб руу — зураг нэмээд өөрөө илгээнэ
    const f = $('#actForm');
    ['src', 'dst', 'giver', 'receiver', 'notes'].forEach(k => f.elements[k].value = a[k] || '');
    $('#items').innerHTML = '';
    (a.items || []).forEach(it => {
      addItem();
      const d = $('#items').lastElementChild;
      d.querySelector('[name=item]').value = it.item || '';
      d.querySelector('[name=qty]').value = it.qty || 1;
      d.querySelector('[name=serial]').value = it.serial || '';
    });
    if (!$('#items').children.length) addItem();
    syncChips(); summary(); show('act');
  }
}
// 🎤 Chrome-ийн дуу таних (mn-MN). Дэмжихгүй бол утасны гарын 🎤-г ашиглана.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $('#mic').hidden = true;
let rec;
function listen() {
  if (rec) return rec.stop();
  rec = new SR(); rec.lang = 'mn-MN'; rec.interimResults = true;
  const base = $('#aiText').value ? $('#aiText').value + ' ' : '';
  rec.onresult = e => $('#aiText').value = base + [...e.results].map(r => r[0].transcript).join('');
  rec.onend = () => { rec = null; $('#mic').classList.remove('rec'); };
  rec.onerror = e => { if (e.error !== 'aborted') alert('Дуу таних: ' + e.error); };
  $('#mic').classList.add('rec'); rec.start();
}

// ── Тайлан ──
// toISOString нь UTC тул +8 цагт өдөр алдагдана — локал огноо
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function seg(id, onChange) {
  document.querySelectorAll(`#${id} .chip`).forEach(c => c.onclick = () => {
    document.querySelectorAll(`#${id} .chip`).forEach(x => x.classList.toggle('on', x === c));
    onChange(c.dataset.v);
  });
  return () => $(`#${id} .chip.on`).dataset.v;
}
const mode = seg('mode', () => loadLog());
$('#pickDate').value = ymd(new Date());
function range() {
  const d = new Date(($('#pickDate').value || ymd(new Date())) + 'T00:00');
  if (mode() === 'day') return [ymd(d), ymd(d)];
  if (mode() === 'week') {   // Даваа → Ням
    const s = new Date(d); s.setDate(d.getDate() - (d.getDay() + 6) % 7);
    const e = new Date(s); e.setDate(s.getDate() + 6);
    return [ymd(s), ymd(e)];
  }
  return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
}
const q = () => { const [a, b] = range(); return `from=${a}&to=${b}&tag=${encodeURIComponent($('#tagFilter').value)}`; };
async function loadLog() {
  const [a, b] = range();
  $('#rangeLbl').textContent = a === b ? a : `${a} — ${b}`;
  try {
    const rows = await (await api('/api/log?' + q())).json();
    const days = {};
    rows.forEach(r => (days[r.date] ||= []).push(r));
    const keys = Object.keys(days).sort().reverse();
    $('#logList').innerHTML = keys.length ? keys.map(d =>
      `<div class="day"><h3>${esc(days[d][0].label)}</h3>` +
      days[d].map(e => { LOG[e.row] = e; const fin = e.text.startsWith('Дууссан: ');
        return `<div class="entry${fin ? ' fin' : ''}" style="display:flex;gap:8px;align-items:center;white-space:normal"><div style="flex:1;white-space:pre-wrap"><time>${esc(e.time)}</time>${e.tag ? `<span class="tag">${esc(e.tag)}</span>` : ''}${fin ? '<span class="ok">✓</span>' + esc(e.text.slice(9)) : esc(e.text)}</div>
        <select class="mv" aria-label="Tag солих" onchange="retag(${e.row}, this.value)">
          <option value="_" selected hidden>#</option>${TAG_OPTS}
          <option value="+">＋ Шинэ tag...</option><option value="">↺ Автомат</option><option value="-">✕ Tag-гүй</option>
        </select></div>`; }).join('') + '</div>'
    ).join('') : '<p class="muted">Бичлэг алга.</p>';
  } catch (e) { $('#logList').innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}
const LOG = {}, TAG_OPTS = $('#tagFilter').innerHTML.replace(/<option value="">[^<]*<\/option>/, '');
async function retag(row, tag) {
  if (tag === '+') { tag = (prompt('Шинэ tag:') || '').trim(); if (!tag) return loadLog(); }
  try { await postJSON('/api/log/tag', { row, text: LOG[row].text, tag }); }
  catch (e) { alert(e.message); }
  loadLog();
}
async function addLog(btn) {
  const t = $('#logText').value.trim();
  if (!t) return;
  btn.disabled = true;
  try {
    await postJSON('/api/log', { text: t, date: $('#logDate').value, tag: $('#logTag').value });
    $('#logText').value = ''; await loadLog();
  } catch (e) { alert(e.message); }
  btn.disabled = false;
}
async function reportPdf(btn) {
  btn.disabled = true;
  try {
    const [a, b] = range();
    download(await (await api('/api/report.pdf?' + q())).blob(), `Тайлан-${a === b ? a : a + '_' + b}.pdf`);
  } catch (e) { alert(e.message); }
  btn.disabled = false;
}

// ── Ажлууд ──
const kind = seg('kind', v => $('#parent').hidden = v !== 'sub');
const EXP = new Set();   // нээлттэй main-ууд (дахин ачаалахад хадгалагдана)
function toggle(id, el) {
  const box = document.querySelector(`.subs[data-for="${CSS.escape(id)}"]`);
  EXP.has(id) ? EXP.delete(id) : EXP.add(id);
  if (box) box.hidden = !EXP.has(id);
  const c = el.querySelector('.cnt'); c.textContent = (EXP.has(id) ? '▾' : '▸') + c.textContent.slice(1);
}
async function loadTasks() {
  try {
    const all = await (await api('/api/tasks')).json();
    const byId = Object.fromEntries(all.map(t => [t.id, t]));
    const isDone = t => t.status === 'Хийсэн';
    const open = all.filter(t => !isDone(t)), done = all.filter(isDone).reverse();
    // sub-ийн main нь харагдахгүй (дууссан) бол "Main › " гэж угтвар тавина
    const name = (t, nested) => (!nested && byId[t.parent] ? `<span class="note">${esc(byId[t.parent].text)} › </span>` : '') + esc(t.text);
    const mains = open.filter(t => !t.parent);
    // ⇄ — өөр main-ийн доор зөөх / дахин main болгох (sub-тай main-ийг сервер татгалзана)
    const mover = t => `<select class="mv" aria-label="Зөөх" onchange="move('${esc(t.id)}', this.value)">
        <option value="_" selected hidden>⇄</option>
        ${t.parent ? '<option value="">↑ Main болгох</option>' : ''}
        ${mains.filter(m => m.id !== t.id && m.id !== t.parent).map(m => `<option value="${esc(m.id)}">↳ ${esc(m.text)}</option>`).join('')}
      </select>`;
    // cnt = {open, total} — sub-тай main бол дарахад sub-ууд нээгдэнэ
    const row = (t, d, nested, cnt) => `<div class="task${d ? ' done' : ''}${nested ? ' sub' : ''}">
        <button class="check" ${d ? 'disabled' : `onclick="finish('${esc(t.id)}')"`} aria-label="Дууссан">${d ? '✓' : ''}</button>
        <div style="flex:1"${cnt ? ` class="fold" onclick="toggle('${esc(t.id)}', this)"` : ''}><div class="t">${name(t, nested)}${cnt
          ? ` <span class="cnt">${EXP.has(t.id) ? '▾' : '▸'} ${cnt.total - cnt.open}/${cnt.total}</span>` : ''}</div>${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
        ${d ? `<div class="note">${esc(t.done)}</div>` : ''}</div>${d ? '' : mover(t)}</div>`;
    const tops = open.filter(t => !open.some(m => m.id === t.parent));
    $('#taskList').innerHTML = tops.length ? tops.map(m => {
      const subs = open.filter(s => s.parent === m.id), total = all.filter(s => s.parent === m.id).length;
      return row(m, false, false, total ? { open: subs.length, total } : null) + (subs.length
        ? `<div class="subs" data-for="${esc(m.id)}"${EXP.has(m.id) ? '' : ' hidden'}>${subs.map(s => row(s, false, true)).join('')}</div>` : '');
    }).join('') : '<p class="muted">Хийх ажил алга 🎉</p>';
    $('#doneList').innerHTML = done.map(t => row(t, true, false)).join('');
    $('#doneWrap').hidden = !done.length;
    const keep = $('#parent').value;
    $('#parent').innerHTML = '<option value="">— Main ажил сонгох —</option>' +
      open.filter(t => !t.parent).map(t => `<option value="${esc(t.id)}">${esc(t.text)}</option>`).join('');
    $('#parent').value = keep;
  } catch (e) { $('#taskList').innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}
async function addTask() {
  const t = $('#taskText').value.trim();
  if (!t) return;
  const parent = kind() === 'sub' ? $('#parent').value : '';
  if (kind() === 'sub' && !parent) return alert('Sub ажлын Main ажлыг сонгоно уу');
  try { await postJSON('/api/tasks', { text: t, parent }); $('#taskText').value = ''; loadTasks(); }
  catch (e) { alert(e.message); }
}
async function move(id, parent) {
  try { await postJSON('/api/tasks/move', { id, parent }); }
  catch (e) { alert(e.message); }
  loadTasks();
}
async function finish(id) {
  const note = prompt('Юу хийж дуусгасан бэ? (заавал биш)');
  if (note === null) return;
  try { await postJSON('/api/tasks/done', { id, note }); loadTasks(); }
  catch (e) { alert(e.message); }
}

// ── Акт ──
const files = new DataTransfer();
const branches = [...document.querySelectorAll('#branches option')].map(o => o.value);
document.querySelectorAll('.chips').forEach(box => {
  const input = $('#' + box.dataset.for);
  branches.forEach(b => {
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'chip'; c.textContent = b;
    c.onclick = () => { input.value = b; syncChips(); };
    box.appendChild(c);
  });
  input.addEventListener('input', syncChips);
});
function syncChips() {
  document.querySelectorAll('.chips').forEach(box => {
    const v = $('#' + box.dataset.for).value;
    box.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.textContent === v));
  });
}
function swapRoute() { const s = $('#src'), d = $('#dst'); [s.value, d.value] = [d.value, s.value]; syncChips(); }

function addItem(focus) {
  const d = document.createElement('div');
  d.className = 'item';
  d.innerHTML =
    '<div class="item-top"><span class="n"></span><button type="button" class="del" aria-label="Устгах">×</button></div>' +
    '<div class="row"><input name="item" placeholder="Зүйл (жш: PC, монитор)">' +
    '<div class="qty"><button type="button" data-d="-1">−</button>' +
    '<input name="qty" type="number" min="1" value="1" inputmode="numeric">' +
    '<button type="button" data-d="1">+</button></div></div>' +
    '<input name="serial" placeholder="Серийн дугаар (олон бол таслалаар)">';
  d.querySelector('.del').onclick = () => { d.remove(); if (!$('#items').children.length) addItem(); renumber(); };
  d.querySelectorAll('.qty button').forEach(b => b.onclick = () => {
    const q = d.querySelector('[name=qty]');
    q.value = Math.max(1, (+q.value || 1) + +b.dataset.d);
  });
  d.querySelector('[name=item]').addEventListener('input', summary);
  $('#items').appendChild(d);
  renumber();
  if (focus) d.querySelector('[name=item]').focus();
}
function renumber() {
  [...$('#items').children].forEach((el, i) => el.querySelector('.n').textContent = 'Зүйл ' + (i + 1));
  summary();
}
$('#pick').addEventListener('change', e => { [...e.target.files].forEach(f => files.items.add(f)); e.target.value = ''; drawPhotos(); });
function drawPhotos() {
  const grid = $('#photos');
  grid.querySelectorAll('.ph:not(.add)').forEach(el => el.remove());
  [...files.files].forEach((f, i) => {
    const el = document.createElement('div'); el.className = 'ph';
    const img = document.createElement('img'); img.src = URL.createObjectURL(f);
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', 'Зураг устгах');
    x.onclick = () => { files.items.remove(i); drawPhotos(); };
    el.append(img, x);
    grid.insertBefore(el, grid.querySelector('.add'));
  });
  summary();
}
function summary() {
  const n = [...document.querySelectorAll('[name=item]')].filter(i => i.value.trim()).length;
  $('#summary').textContent = `${n} зүйл · ${files.files.length} зураг`;
}

$('#actForm').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#actSend'), label = b.innerHTML;
  b.disabled = true; b.textContent = 'Акт гаргаж байна...';
  try {
    const fd = new FormData(e.target);
    [...files.files].forEach(f => fd.append('photos', f));
    const r = await api('/api/act', { method: 'POST', body: fd });
    const id = r.headers.get('X-Act-Id'), blob = await r.blob();
    download(blob, id + '.pdf');
    $('#actDone').hidden = false;
    $('#actDone').innerHTML = `✅ <b>${esc(id)}</b> гарлаа. PDF татагдсан — хүнд дамжуулж болно.`;
    e.target.reset(); files.items.clear(); drawPhotos(); $('#items').innerHTML = ''; addItem(); syncChips();
    scrollTo(0, 0); searchActs();
  } catch (err) { alert(err.message); }
  b.disabled = false; b.innerHTML = label; summary();
});

let qTimer;
function searchActs() {
  clearTimeout(qTimer);
  qTimer = setTimeout(async () => {
    try {
      const rows = await (await api('/api/acts?q=' + encodeURIComponent($('#actQ').value))).json();
      const acts = {};
      rows.forEach(r => (acts[r['Акт ID']] ||= []).push(r));
      $('#actList').innerHTML = Object.entries(acts).map(([id, its]) => {
        const a = its[0];
        return `<div class="act"><b>${esc(id)}</b> · ${esc(a['Огноо'])}<br>${esc(a['Хаанаас'])} → ${esc(a['Хаашаа'])}
          <div class="muted">${its.map(i => esc(i['Тоо'] + 'ш ' + i['Зүйл'] + (i['Серийн дугаар'] ? ' (' + i['Серийн дугаар'] + ')' : ''))).join(', ')}</div>
          ${a['Discord'] ? `<a href="${esc(a['Discord'])}" target="_blank">Discord-оос PDF</a>` : ''}</div>`;
      }).join('') || '<p class="muted">Олдсонгүй.</p>';
    } catch (e) { $('#actList').innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
  }, 250);
}

addItem();
show('tasks');   // нүүр таб — Ажлууд
</script>
</body>
